  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght:1.25;font-weight:600;margin:8px 0}\n.h3{font-size:15px;font-weight:600;margin:0}\n.body{margin:0;font-size:14.5px;line-height:1.6}\n.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}\n.between{justify-content:space-between}\n.grow{flex:1;min-width:0}\n.mt{margin-top:16px}\n.stack{display:flex;flex-direction:column;gap:20px}\n.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.chip{display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;line-height:22px;white-space:nowrap}\n.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}\n.chip.plain::before{display:none}\n.chip.ok{background:#E8F5EE;color:#14663D}\n.chip.warn{background:#FFF4DB;color:#7A4B00}\n.chip.bad{background:#FDECEA;color:#A5261B}\n.chip.info{background:#EAF0FE;color:#2349B5}\n.chip.mute{background:#F0F1F3;color:#4B525B}\n.btn{border:1px solid #D0D4DA;background:#fff;border-radius:8px;padding:0 16px;min-height:44px;font-weight:500;line-height:1.2}\n.btn:hover:not(:disabled){background:#F6F7F8}\n.btn.sm{min-height:36px;padding:0 12px;font-size:13px}\n.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}\n.btn.pri:hover:not(:disabled){background:var(--accent);filter:brightness(.92)}\n.btn:disabled{opacity:.5}\n.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;padding:6px 0;min-height:36px}\n.linkbtn:hover{text-decoration:underline}\n.segs{display:inline-flex;border:1px solid #D0D4DA;border-radius:8px;overflow:hidden;background:#fff;flex-wrap:wrap}\n.seg{border:0;background:#fff;padding:0 14px;min-height:44px;border-right:1px solid #D0D4DA;font-weight:500}\n.seg:last-child{border-right:0}\n.seg:hover{background:#F6F7F8}\n.seg.on{background:#1F2328;color:#fff}\n.seg.on-ok{background:#E8F5EE;color:#14663D}\n.seg.on-bad{background:#FDECEA;color:#A5261B}\n.seg.on-warn{background:#FFF4DB;color:#7A4B00}\n.card{border:1px solid #E4E6EA;border-radius:12px;background:#fff}\n.card-h{padding:14px 20px;border-bottom:1px solid #EEF0F2;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}\n.card-b{padding:20px}\n.card-b.nopad{padding:0}\n.note{margin-top:14px;padding:10px 14px;background:#F6F7F8;border-radius:8px;color:#5B6169;font-size:13px}\n.head{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px}\n.head-main{flex:1 1 480px;min-width:0}\n.meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:#5B6169}\n.tabs{display:flex;gap:4px;border-bottom:1px solid #E4E6EA;overflow-x:auto;margin-bottom:24px}\n.tab{border:0;background:none;padding:0 14px;min-height:44px;font-weight:500;color:#5B6169;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}\n.tab:hover{color:#1F2328}\n.tab.on{color:#1F2328;border-bottom-color:var(--accent)}\n.tab .n{margin-left:6px;background:#F0F1F3;border-radius:999px;padding:1px 8px;font-size:12px;color:#4B525B}\n.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}\n.main{flex:999 1 620px;min-width:0}\n.rail{flex:1 1 300px;max-width:360px;position:sticky;top:16px}\n.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:18px}\n.listrow{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid #EEF0F2;flex-wrap:wrap}\n.listrow:last-child{border-bottom:0}\n.lrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #EEF0F2;flex-wrap:wrap}\n.lrow:last-child{border-bottom:0}\n.rnum{width:24px;height:24px;border-radius:50%;background:#F0F1F3;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}\n.sha{color:#5B6169;flex:none}\n.tiles{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}\n.tile{background:#F6F7F8;border-radius:10px;padding:12px 16px;min-width:120px}\n.tnum{font-size:22px;font-weight:600;line-height:1.2}\n.tnum.add{color:#14663D}\n.tnum.del{color:#A5261B}\n.list{margin:8px 0 0;padding-left:20px;line-height:1.7}\n.agentrow{display:flex;gap:12px;align-items:center}\n.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}\n.gcard{background:#F6F7F8;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}\n.gbig{font-size:20px;font-weight:600}\n.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}\n.filelist{flex:1 1 240px;max-width:300px;overflow:hidden}\n.filedetail{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:16px}\n.fileitem{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;border-bottom:1px solid #EEF0F2;background:#fff;padding:12px 16px;min-height:44px;border-left:3px solid transparent}\n.fileitem:hover{background:#F6F7F8}\n.fileitem.on{background:#F6F7F8;border-left-color:var(--accent)}\n.fileitem:last-child{border-bottom:0}\n.fname{font-weight:600;word-break:break-all}\n.fdir{color:#5B6169;font-size:12px;word-break:break-all}\n.add{color:#14663D}\n.del{color:#A5261B}\n.linebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;background:#EAF0FE;border-radius:8px;color:#2349B5;font-size:13px}\n.diff{border:1px solid #E4E6EA;border-radius:10px;overflow:hidden;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px}\n.drow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px minmax(0,1fr)}\n.drow.new{grid-template-columns:44px minmax(0,1fr)}\n.drow.old{grid-template-columns:44px minmax(0,1fr)}\n.drow.new .o{display:none}\n.drow.old .n{display:none}\n.drow.sel{outline:2px solid var(--accent);outline-offset:-2px}\n.cell{padding:0 10px;min-height:22px;line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}\n.cell.del{background:#FDECEA;color:#1F2328}\n.cell.add{background:#E8F5EE;color:#1F2328}\n.cell.empty{background:#F6F7F8}\n.ln{border:0;border-right:1px solid #EEF0F2;background:#FAFAFB;color:#5B6169;text-align:right;padding:0 8px;line-height:22px;min-height:22px;font-family:inherit;font-size:12px}\n.ln:hover:not(:disabled){background:#EAF0FE;color:#2349B5}\n.ln.del{background:#FAD9D5}\n.ln.add{background:#CFEBDA}\n.nc-box{border:1px dashed #B8BEC6;border-radius:10px;padding:24px;background:#F6F7F8;color:#4B525B}\n.ev{border-bottom:1px solid #EEF0F2}\n.ev:last-child{border-bottom:0}\n.evh{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:0;text-align:left;padding:12px 20px;min-height:48px;flex-wrap:wrap}\n.evh:hover{background:#F6F7F8}\n.evb{padding:0 20px 16px}\n.log{margin:8px 0 0;padding:12px 14px;background:#F6F7F8;border:1px solid #E4E6EA;border-radius:8px;overflow-x:auto;white-space:pre;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6}\n.step{display:flex;gap:12px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid #EEF0F2;min-height:44px}\n.step:last-child{border-bottom:0}\n.step input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}\n.cmd{display:block;margin-top:6px;padding:6px 10px;background:#F6F7F8;border:1px solid #E4E6EA;border-radius:6px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;overflow-x:auto;white-space:pre}\n.req{padding:20px;border-bottom:1px solid #EEF0F2}\n.req:last-child{border-bottom:0}\n.tl{border-left:2px solid #E4E6EA;margin:12px 0 0 6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}\n.tl-who{font-weight:600;font-size:13px}\n.input{width:100%;border:1px solid #D0D4DA;border-radius:8px;padding:10px 12px;background:#fff;min-height:44px}\ntextarea.input{min-height:88px;resize:vertical;line-height:1.5}\n.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}\n.bar{height:8px;border-radius:4px;background:#EEF0F2;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}\n.prog{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #EEF0F2}\n.prog:last-child{border-bottom:0}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}\n.stat{border:1px solid #E4E6EA;border-radius:10px;padding:14px 16px}\n.snum{font-size:24px;font-weight:600;line-height:1.3}\n.snum.ok{color:#14663D}\n.snum.bad{color:#A5261B}\n.snum.warn{color:#7A4B00}\n.noteitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EEF0F2}\n.noteitem:last-child{border-bottom:0}\n.banner{padding:16px 20px;border-radius:10px;font-weight:500}\n.banner.ok{background:#E8F5EE;color:#14663D}\n.banner.warn{background:#FFF4DB;color:#7A4B00}\n.err{color:#A5261B;font-size:13px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"zk\" style=\"--accent: {{ accent }}\" data-canvas-width=\"1360\" data-canvas-height=\"1500\">\n\n<div class=\"topbar\"><div class=\"wrap bar-row\">\n  <div class=\"brand\"><span class=\"mark\">Z<\u002Fspan><span>Ziki<\u002Fspan><\u002Fdiv>\n  <nav class=\"crumbs\" aria-label=\"Breadcrumb\"><span>{{ projectName }}<\u002Fspan><span class=\"sep\">/<\u002Fspan><span>Issues<\u002Fspan><span class=\"sep\">/<\u002Fspan><span class=\"cur\">{{ crumbLast }}<\u002Fspan><\u002Fnav>\n  <span class=\"avatar\" aria-label=\"Signed in as DO\">DO<\u002Fspan>\n<\u002Fdiv><\u002Fdiv>\n\n<div class=\"demo\"><div class=\"wrap demo-row\">\n  <span class=\"sub\"><strong>Illustrative sample data.<\u002Fstrong> Open an example:<\u002Fspan>\n  <div class=\"segs\">\n    <button class=\"seg {{ demoPrCls }}\" sc-camel-on-click=\"{{ openPR }}\">GitHub pull request<\u002Fbutton>\n    <button class=\"seg {{ demoDxCls }}\" sc-camel-on-click=\"{{ openDX }}\">Direct Ziki execution<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"wrap page\">\n  <h1 class=\"h1\">Work awaiting your review<\u002Fh1>\n  <p class=\"sub\" style=\"margin:0 0 20px\">Completed by agents. Every item opens the same review, whether the work went through GitHub or ran directly in Ziki.<\u002Fp>\n  <div class=\"card\">\n    <sc-for list=\"{{ listItems }}\" as=\"li\" hint-placeholder-count=\"2\">\n      <div class=\"listrow\">\n        <div class=\"grow\">\n          <div class=\"chips\"><span class=\"mono sub\">{{ li.ref }}<\u002Fspan><span class=\"chip plain mute\">{{ li.method }}<\u002Fspan><\u002Fdiv>\n          <div class=\"strong\" style=\"margin-top:4px\">{{ li.title }}<\u002Fdiv>\n          <div class=\"sub\">{{ li.agent }} · completed {{ li.completed }}<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"chip {{ li.statusTone }}\">{{ li.statusLabel }}<\u002Fspan>\n        <button class=\"btn pri\" sc-camel-on-click=\"{{ li.open }}\">Review work<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"wrap page\">\n  <button class=\"linkbtn\" sc-camel-on-click=\"{{ backToList }}\">← Work awaiting review<\u002Fbutton>\n  <div class=\"head\">\n    <div class=\"head-main\">\n      <div class=\"chips\"><span class=\"mono sub\">{{ ref }}<\u002Fspan><span class=\"chip ok\">Completed<\u002Fspan><span class=\"chip plain mute\">{{ methodLabel }}<\u002Fspan><\u002Fdiv>\n      <h1 class=\"h1\">{{ title }}<\u002Fh1>\n      <div class=\"meta\"><span>Agent <strong>{{ agent }}<\u002Fstrong><\u002Fspan><span>Completed {{ completed }}<\u002Fspan><span>{{ projectName }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chips\"><span class=\"sub\">Human review<\u002Fspan><span class=\"chip {{ rsTone }}\">{{ rsLabel }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"tabs\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <button class=\"tab {{ t.cls }}\" sc-camel-on-click=\"{{ t.go }}\">{{ t.label }}<sc-if value=\"{{ t.hasCount }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"n\">{{ t.count }}<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div class=\"cols\">\n  <div class=\"main\">\n\n  <sc-if value=\"{{ tOverview }}\" hint-placeholder-val=\"{{ true }}\">\n  <div class=\"stack\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">{{ origLabel }}<\u002Fh2><span class=\"chip plain mute\">{{ origSource }}<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b\">\n        <p class=\"body\">{{ origText }}<\u002Fp>\n        <div class=\"kvs\"><sc-for list=\"{{ kvs }}\" as=\"kv\" hint-placeholder-count=\"3\"><div><div class=\"lbl\">{{ kv.k }}<\u002Fdiv><div>{{ kv.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-h\">\n        <div class=\"agentrow\"><span class=\"avatar ag\">{{ agentInitial }}<\u002Fspan><div><div class=\"strong\">{{ agent }}<\u002Fdiv><div class=\"sub\">{{ agentRole }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <span class=\"chip plain mute\">Agent-reported summary<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card-b\">\n        <p class=\"body\">{{ summary }}<\u002Fp>\n        <div class=\"note\">This is the agent's own account of its work. Use Evidence and Requirements to check it independently.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isPR }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Pull request<\u002Fh2><div class=\"chips\"><span class=\"chip info\">Open<\u002Fspan><span class=\"chip mute\">Not merged<\u002Fspan><span class=\"chip warn\">Checks passed (1 re-run)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"card-b\">\n        <div class=\"strong\">{{ prTitle }}<\u002Fdiv>\n        <div class=\"mono sub\" style=\"margin-top:4px\">{{ prBranch }}<\u002Fdiv>\n        <div class=\"tiles\"><sc-for list=\"{{ tiles }}\" as=\"ti\" hint-placeholder-count=\"3\"><div class=\"tile\"><div class=\"tnum {{ ti.cls }}\">{{ ti.n }}<\u002Fdiv><div class=\"sub\">{{ ti.l }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div class=\"row\"><button class=\"btn sm\" disabled=\"\">Open on GitHub<\u002Fbutton><span class=\"sub\">{{ prRepo }} · link disabled in this illustration<\u002Fspan><\u002Fdiv>\n        <div class=\"lbl mt\">Agent's explanation of the implementation<\u002Fdiv>\n        <ul class=\"list\"><sc-for list=\"{{ explain }}\" as=\"ex\" hint-placeholder-count=\"3\"><li>{{ ex }}<\u002Fli><\u002Fsc-for><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDX }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Execution<\u002Fh2><span class=\"chip plain info\">Direct Ziki execution<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b\">\n        <p class=\"body\">{{ dxNote }}<\u002Fp>\n        <div class=\"tiles\"><sc-for list=\"{{ tiles }}\" as=\"tj\" hint-placeholder-count=\"3\"><div class=\"tile\"><div class=\"tnum\">{{ tj.n }}<\u002Fdiv><div class=\"sub\">{{ tj.l }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Requirements<\u002Fh2><button class=\"linkbtn\" sc-camel-on-click=\"{{ goReq }}\">Review requirements<\u002Fbutton><\u002Fdiv>\n      <div class=\"card-b nopad\"><sc-for list=\"{{ reqs }}\" as=\"rq\" hint-placeholder-count=\"4\">\n        <div class=\"lrow\"><span class=\"rnum\">{{ rq.num }}<\u002Fspan><span class=\"grow\">{{ rq.text }}<\u002Fspan><span class=\"chip {{ rq.stateTone }}\">{{ rq.stateLabel }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isPR }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Work performed<\u002Fh2><span class=\"sub\">3 commits<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b nopad\"><sc-for list=\"{{ commits }}\" as=\"cm\" hint-placeholder-count=\"3\">\n        <div class=\"lrow\"><span class=\"mono sha\">{{ cm.sha }}<\u002Fspan><span class=\"grow\">{{ cm.msg }}<\u002Fspan><span class=\"sub\">{{ cm.t }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDX }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Work performed<\u002Fh2><button class=\"linkbtn\" sc-camel-on-click=\"{{ goExec }}\">Inspect actions<\u002Fbutton><\u002Fdiv>\n      <div class=\"card-b nopad\"><sc-for list=\"{{ actions }}\" as=\"ac\" hint-placeholder-count=\"6\">\n        <div class=\"lrow\"><span class=\"rnum\">{{ ac.n }}<\u002Fspan><span class=\"grow\">{{ ac.title }}<\u002Fspan><span class=\"chip {{ ac.tone }}\">{{ ac.outcome }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Testing and evidence<\u002Fh2><button class=\"linkbtn\" sc-camel-on-click=\"{{ goEvidence }}\">Open evidence<\u002Fbutton><\u002Fdiv>\n      <div class=\"card-b\"><div class=\"glance\"><sc-for list=\"{{ glance }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div class=\"gcard\"><span class=\"chip plain {{ g.tagTone }}\">{{ g.tag }}<\u002Fspan><div class=\"gbig\">{{ g.big }}<\u002Fdiv><div class=\"sub\">{{ g.sub }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tExecution }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"stack\">\n    <p class=\"sub\" style=\"margin:0\">Each action the agent took, in order. Expand an action to see what was recorded. Anything not recorded is marked as such.<\u002Fp>\n    <sc-for list=\"{{ actions }}\" as=\"ax\" hint-placeholder-count=\"6\">\n    <div class=\"card\">\n      <button class=\"evh\" sc-camel-on-click=\"{{ ax.toggle }}\" aria-expanded=\"{{ ax.open }}\">\n        <span class=\"rnum\">{{ ax.n }}<\u002Fspan>\n        <span class=\"grow\"><span class=\"strong\">{{ ax.title }}<\u002Fspan><br><span class=\"sub\">{{ ax.kind }}<\u002Fspan><\u002Fspan>\n        <span class=\"chip {{ ax.tone }}\">{{ ax.outcome }}<\u002Fspan>\n        <span class=\"sub\">{{ ax.chev }}<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ ax.open }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"evb\">\n        <p class=\"body\">{{ ax.detail }}<\u002Fp>\n        <sc-if value=\"{{ ax.hasLog }}\" hint-placeholder-val=\"{{ true }}\"><pre class=\"log\">{{ ax.log }}<\u002Fpre><\u002Fsc-if>\n        <sc-if value=\"{{ ax.scope }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note\">This action is outside the original instruction. Decide whether it should stay.<\u002Fdiv><\u002Fsc-if>\n        <div class=\"row mt\">\n          <sc-if value=\"{{ ax.hasChange }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn sm\" sc-camel-on-click=\"{{ ax.goChange }}\">View the change<\u002Fbutton><\u002Fsc-if>\n          <button class=\"btn sm\" sc-camel-on-click=\"{{ ax.flag }}\">Flag this action<\u002Fbutton>\n          <sc-if value=\"{{ ax.hasDisputes }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"chip warn\">{{ ax.disputeCount }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tChanges }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"split\">\n    <div class=\"card filelist\">\n      <div class=\"card-h\"><h2 class=\"h3\">{{ changesTitle }}<\u002Fh2><span class=\"sub\">{{ changesSub }}<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ changes }}\" as=\"ch\" hint-placeholder-count=\"4\">\n        <button class=\"fileitem {{ ch.cls }}\" sc-camel-on-click=\"{{ ch.pick }}\">\n          <span class=\"fname\">{{ ch.name }}<\u002Fspan>\n          <span class=\"fdir\">{{ ch.dir }}<\u002Fspan>\n          <span class=\"row\" style=\"gap:8px\"><span class=\"chip plain {{ ch.kindTone }}\">{{ ch.kindLabel }}<\u002Fspan><span class=\"chip {{ ch.revTone }}\">{{ ch.revLabel }}<\u002Fspan><\u002Fspan>\n          <sc-if value=\"{{ ch.hasStats }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"mono\"><span class=\"add\">+{{ ch.adds }}<\u002Fspan> <span class=\"del\">−{{ ch.dels }}<\u002Fspan><\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"filedetail\">\n      <div class=\"card\">\n        <div class=\"card-h\">\n          <div><div class=\"strong mono\">{{ selPath }}<\u002Fdiv><div class=\"sub\">{{ selKindText }}<\u002Fdiv><\u002Fdiv>\n          <div class=\"row\">\n            <button class=\"btn sm\" sc-camel-on-click=\"{{ toggleReviewed }}\">{{ reviewBtn }}<\u002Fbutton>\n            <button class=\"btn sm pri\" sc-camel-on-click=\"{{ raiseOnChange }}\">Raise dispute<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-b\">\n          <sc-if value=\"{{ hasSelLine }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"linebar\"><span>Selected: {{ selLineLabel }}. A dispute raised now will point to this line.<\u002Fspan><button class=\"linkbtn\" sc-camel-on-click=\"{{ clearLine }}\">Clear<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasDiff }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"sub\" style=\"margin:0 0 10px\">{{ diffHelp }}<\u002Fdiv>\n            <div class=\"diff\">\n              <sc-for list=\"{{ diff }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <div class=\"{{ r.rowCls }}\">\n                  <button class=\"ln o {{ r.oLn }}\" disabled=\"{{ r.noO }}\" sc-camel-on-click=\"{{ r.pickO }}\" aria-label=\"{{ r.oAria }}\">{{ r.oNo }}<\u002Fbutton>\n                  <div class=\"{{ r.oCls }}\">{{ r.oTxt }}<\u002Fdiv>\n                  <button class=\"ln n {{ r.nLn }}\" disabled=\"{{ r.noN }}\" sc-camel-on-click=\"{{ r.pickN }}\" aria-label=\"{{ r.nAria }}\">{{ r.nNo }}<\u002Fbutton>\n                  <div class=\"{{ r.nCls }}\">{{ r.nTxt }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noDiff }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"nc-box\"><div class=\"strong\">Before and after not captured<\u002Fdiv><p class=\"body\" style=\"margin-top:6px\">The execution recorded that this component was modified, but it did not record what changed. Ziki cannot show a comparison for it. Check the project's own history, or flag the action.<\u002Fp><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"card-h\"><h2 class=\"h3\">Disputes on this item<\u002Fh2><span class=\"sub\">{{ itemDisputeCount }}<\u002Fspan><\u002Fdiv>\n        <div class=\"card-b nopad\">\n          <sc-if value=\"{{ noItemDisputes }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"lrow sub\">No disputes raised on this item.<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ itemDisputes }}\" as=\"idp\" hint-placeholder-count=\"1\">\n            <div class=\"lrow\"><span class=\"mono\">{{ idp.id }}<\u002Fspan><span class=\"chip {{ idp.sevTone }}\">{{ idp.sevLabel }}<\u002Fspan><span class=\"grow\">{{ idp.text }}<\u002Fspan><span class=\"chip {{ idp.stTone }}\">{{ idp.stLabel }}<\u002Fspan><button class=\"linkbtn\" sc-camel-on-click=\"{{ idp.openAll }}\">Open<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tEvidence }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"stack\">\n    <p class=\"sub\" style=\"margin:0\">Evidence is grouped by who produced it. Nothing here is treated as proof on its own. Decide for yourself.<\u002Fp>\n    <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"2\">\n    <div class=\"card\">\n      <div class=\"card-h\"><div><div class=\"chips\"><span class=\"chip plain {{ sec.tagTone }}\">{{ sec.tag }}<\u002Fspan><\u002Fdiv><h2 class=\"h3\" style=\"margin-top:6px\">{{ sec.title }}<\u002Fh2><div class=\"sub\">{{ sec.desc }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"card-b nopad\">\n        <sc-for list=\"{{ sec.rows }}\" as=\"er\" hint-placeholder-count=\"3\">\n        <div class=\"ev\">\n          <button class=\"evh\" sc-camel-on-click=\"{{ er.toggle }}\" aria-expanded=\"{{ er.open }}\">\n            <span class=\"grow\"><span class=\"strong\">{{ er.title }}<\u002Fspan><br><span class=\"sub\">{{ er.meta }}<\u002Fspan><\u002Fspan>\n            <span class=\"chip {{ er.tone }}\">{{ er.label }}<\u002Fspan>\n            <span class=\"sub\">{{ er.chev }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ er.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"evb\">\n            <p class=\"body\">{{ er.note }}<\u002Fp>\n            <sc-if value=\"{{ er.hasLog }}\" hint-placeholder-val=\"{{ true }}\"><pre class=\"log\">{{ er.log }}<\u002Fpre><\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-for>\n    <div class=\"card\">\n      <div class=\"card-h\"><div><div class=\"chips\"><span class=\"chip plain ok\">Your verification<\u002Fspan><\u002Fdiv><h2 class=\"h3\" style=\"margin-top:6px\">Verify it yourself<\u002Fh2><div class=\"sub\">Steps you can run independently. Tick them as you go.<\u002Fdiv><\u002Fdiv><span class=\"sub\">{{ stepsDone }}<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b nopad\">\n        <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <label class=\"step\"><input type=\"checkbox\" checked=\"{{ st.done }}\" sc-camel-on-change=\"{{ st.toggle }}\"><span class=\"grow\"><span>{{ st.text }}<\u002Fspan><sc-if value=\"{{ st.hasCmd }}\" hint-placeholder-val=\"{{ false }}\"><code class=\"cmd\">{{ st.cmd }}<\u002Fcode><\u002Fsc-if><\u002Fspan><\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tRequirements }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"card\">\n    <div class=\"card-h\"><h2 class=\"h3\">Requirements<\u002Fh2><span class=\"sub\">Compare the work against what was asked. The agent's claim is shown for reference only.<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ reqs }}\" as=\"q\" hint-placeholder-count=\"4\">\n    <div class=\"req\">\n      <div class=\"row\" style=\"align-items:flex-start\"><span class=\"rnum\">{{ q.num }}<\u002Fspan><div class=\"grow\"><div class=\"strong\">{{ q.text }}<\u002Fdiv>\n        <div class=\"row\" style=\"margin-top:8px\"><span class=\"chip plain mute\">Agent reports: met<\u002Fspan><span class=\"chip {{ q.evTone }}\">{{ q.ev }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><span class=\"chip {{ q.stateTone }}\">{{ q.stateLabel }}<\u002Fspan><\u002Fdiv>\n      <div class=\"row mt\" style=\"margin-left:36px\">\n        <div class=\"segs\">\n          <button class=\"seg {{ q.vCls }}\" sc-camel-on-click=\"{{ q.setV }}\">Verified<\u002Fbutton>\n          <button class=\"seg {{ q.nCls }}\" sc-camel-on-click=\"{{ q.setN }}\">Not satisfied<\u002Fbutton>\n          <button class=\"seg {{ q.iCls }}\" sc-camel-on-click=\"{{ q.setI }}\">Needs investigation<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"btn sm\" sc-camel-on-click=\"{{ q.raise }}\">Raise dispute<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tDisputes }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"stack\">\n    <div class=\"row between\">\n      <div class=\"segs\"><button class=\"seg {{ fActiveCls }}\" sc-camel-on-click=\"{{ fActive }}\">Outstanding ({{ nActive }})<\u002Fbutton><button class=\"seg {{ fAllCls }}\" sc-camel-on-click=\"{{ fAll }}\">All ({{ nAll }})<\u002Fbutton><\u002Fdiv>\n      <span class=\"sub\">Raise disputes from a file, an action or a requirement.<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ noDisputes }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"nc-box\">No disputes to show. Raise one from a changed file, an action or a requirement.<\u002Fdiv><\u002Fsc-if>\n    <sc-for list=\"{{ disputes }}\" as=\"d\" hint-placeholder-count=\"1\">\n    <div class=\"card\">\n      <div class=\"card-h\">\n        <div class=\"chips\"><span class=\"mono strong\">{{ d.id }}<\u002Fspan><span class=\"chip {{ d.sevTone }}\">{{ d.sevLabel }}<\u002Fspan><span class=\"chip {{ d.stTone }}\">{{ d.stLabel }}<\u002Fspan><\u002Fdiv>\n        <button class=\"linkbtn\" sc-camel-on-click=\"{{ d.goTarget }}\">On: {{ d.tLabel }}{{ d.lineText }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"card-b\">\n        <div class=\"lbl\">Why I disagree<\u002Fdiv><p class=\"body\">{{ d.text }}<\u002Fp>\n        <sc-if value=\"{{ d.hasFix }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"lbl mt\">Requested correction<\u002Fdiv><p class=\"body\">{{ d.fix }}<\u002Fp><\u002Fsc-if>\n        <div class=\"lbl mt\">Activity<\u002Fdiv>\n        <div class=\"tl\"><sc-for list=\"{{ d.events }}\" as=\"ev\" hint-placeholder-count=\"2\"><div><div class=\"tl-who\">{{ ev.who }} <span class=\"sub\">· {{ ev.time }}<\u002Fspan><\u002Fdiv><div>{{ ev.text }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div class=\"row mt\">\n          <sc-if value=\"{{ d.canReply }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn sm\" sc-camel-on-click=\"{{ d.reply }}\">Demo: simulate agent reply<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ d.canResolve }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn sm pri\" sc-camel-on-click=\"{{ d.resolve }}\">Mark resolved<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ d.canReopen }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn sm\" sc-camel-on-click=\"{{ d.reopen }}\">Reopen<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tDecision }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"stack\">\n    <sc-if value=\"{{ hasDecision }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"banner {{ decisionTone }}\">{{ decisionText }}<\u002Fdiv><\u002Fsc-if>\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Review summary<\u002Fh2><span class=\"chip {{ rsTone }}\">{{ rsLabel }}<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b\">\n        <div class=\"stats\"><sc-for list=\"{{ stats }}\" as=\"sx\" hint-placeholder-count=\"6\"><div class=\"stat\"><div class=\"lbl\">{{ sx.k }}<\u002Fdiv><div class=\"snum {{ sx.tone }}\">{{ sx.v }}<\u002Fdiv><div class=\"sub\">{{ sx.sub }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div class=\"lbl mt\">Before you decide<\u002Fdiv>\n        <div><sc-for list=\"{{ notes }}\" as=\"nt\" hint-placeholder-count=\"2\"><div class=\"noteitem\"><span class=\"chip {{ nt.tone }}\">{{ nt.tag }}<\u002Fspan><span class=\"grow\">{{ nt.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"card-b\">\n        <div class=\"row\">\n          <button class=\"btn pri\" disabled=\"{{ approveDisabled }}\" sc-camel-on-click=\"{{ approve }}\">Approve work<\u002Fbutton>\n          <button class=\"btn\" disabled=\"{{ requestDisabled }}\" sc-camel-on-click=\"{{ requestChanges }}\">Request changes<\u002Fbutton>\n          <button class=\"btn\" sc-camel-on-click=\"{{ continueReview }}\">Continue reviewing<\u002Fbutton>\n          <sc-if value=\"{{ hasDecision }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"linkbtn\" sc-camel-on-click=\"{{ undoDecision }}\">Undo decision<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasApproveHint }}\" hint-placeholder-val=\"{{ true }}\"><p class=\"sub\" style=\"margin:12px 0 0\">{{ approveHint }}<\u002Fp><\u002Fsc-if>\n        <div class=\"note\">{{ decisionNote }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <aside class=\"rail\">\n    <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Raise a dispute<\u002Fh2><\u002Fdiv>\n      <div class=\"card-b\">\n        <div class=\"sub\">On<\u002Fdiv>\n        <div class=\"strong\" style=\"word-break:break-all\">{{ form.tLabel }}<\u002Fdiv>\n        <sc-if value=\"{{ form.hasLine }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sub\">{{ form.line }}<\u002Fdiv><\u002Fsc-if>\n        <div class=\"field\"><label class=\"strong\" for=\"dsp-text\">Why do you disagree?<\u002Flabel><textarea id=\"dsp-text\" class=\"input\" sc-camel-on-input=\"{{ form.setText }}\" sc-camel-on-change=\"{{ form.setText }}\"><\u002Ftextarea><\u002Fdiv>\n        <div class=\"field\"><label class=\"strong\" for=\"dsp-fix\">Requested correction<\u002Flabel><textarea id=\"dsp-fix\" class=\"input\" sc-camel-on-input=\"{{ form.setFix }}\" sc-camel-on-change=\"{{ form.setFix }}\"><\u002Ftextarea><\u002Fdiv>\n        <div class=\"field\"><label class=\"strong\" for=\"dsp-sev\">Severity<\u002Flabel><sc-raw-select id=\"dsp-sev\" class=\"input\" sc-camel-on-change=\"{{ form.setSev }}\"><option value=\"should\">Should fix<\u002Foption><option value=\"blocking\">Blocking<\u002Foption><option value=\"question\">Question<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <sc-if value=\"{{ form.err }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" style=\"margin:12px 0 0\">Add a reason so the agent knows what to address.<\u002Fp><\u002Fsc-if>\n        <div class=\"row mt\"><button class=\"btn pri\" sc-camel-on-click=\"{{ form.submit }}\">Submit dispute<\u002Fbutton><button class=\"btn\" sc-camel-on-click=\"{{ form.cancel }}\">Cancel<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ formClosed }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Your review<\u002Fh2><span class=\"chip {{ rsTone }}\">{{ rsLabel }}<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b\">\n        <sc-if value=\"{{ hasFlash }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note\" style=\"margin:0 0 14px\">{{ flash }}<\u002Fdiv><\u002Fsc-if>\n        <div class=\"row between\"><span class=\"sub\">Review progress<\u002Fspan><span class=\"strong\">{{ pct }}%<\u002Fspan><\u002Fdiv>\n        <div class=\"bar\" style=\"margin:8px 0 12px\"><i style=\"width: {{ pct }}%\"><\u002Fi><\u002Fdiv>\n        <sc-for list=\"{{ railRows }}\" as=\"rr\" hint-placeholder-count=\"4\"><div class=\"prog\"><span class=\"sub\">{{ rr.k }}<\u002Fspan><span class=\"strong\">{{ rr.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <button class=\"btn pri\" style=\"width:100%;margin-top:16px\" sc-camel-on-click=\"{{ goDecision }}\">Go to decision<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Faside>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div class=\"zk\" style=\"--accent: #4F46E5\" data-canvas-width=\"1360\" data-canvas-height=\"1500\" data-document-role=\"page\" data-label=\"Work Review\">\n\n<div class=\"topbar\"><div class=\"wrap bar-row\">\n  <div class=\"brand\"><span class=\"mark\">Z<\u002Fspan><span>Ziki<\u002Fspan><\u002Fdiv>\n  <nav class=\"crumbs\" aria-label=\"Breadcrumb\"><span>{{ projectName }}<\u002Fspan><span class=\"sep\">/<\u002Fspan><span>Issues<\u002Fspan><span class=\"sep\">/<\u002Fspan><span class=\"cur\">{{ crumbLast }}<\u002Fspan><\u002Fnav>\n  <span class=\"avatar\" aria-label=\"Signed in as DO\">DO<\u002Fspan>\n<\u002Fdiv><\u002Fdiv>\n\n<div class=\"demo\"><div class=\"wrap demo-row\">\n  <span class=\"sub\"><strong>Illustrative sample data.<\u002Fstrong> Open an example:<\u002Fspan>\n  <div class=\"segs\">\n    <button class=\"seg \">GitHub pull request<\u002Fbutton>\n    <button class=\"seg \">Direct Ziki execution<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n\n<div class=\"wrap page\">\n  <h1 class=\"h1\">Work awaiting your review<\u002Fh1>\n  <p class=\"sub\" style=\"margin:0 0 20px\">Completed by agents. Every item opens the same review, whether the work went through GitHub or ran directly in Ziki.<\u002Fp>\n  <div class=\"card\">\n    \n      <div class=\"listrow\">\n        <div class=\"grow\">\n          <div class=\"chips\"><span class=\"mono sub\">{{ li.ref }}<\u002Fspan><span class=\"chip plain mute\">{{ li.method }}<\u002Fspan><\u002Fdiv>\n          <div class=\"strong\" style=\"margin-top:4px\">{{ li.title }}<\u002Fdiv>\n          <div class=\"sub\">{{ li.agent }} · completed {{ li.completed }}<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"chip \">{{ li.statusLabel }}<\u002Fspan>\n        <button class=\"btn pri\">Review work<\u002Fbutton>\n      <\u002Fdiv>\n    \n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<div class=\"wrap page\">\n  <button class=\"linkbtn\">← Work awaiting review<\u002Fbutton>\n  <div class=\"head\">\n    <div class=\"head-main\">\n      <div class=\"chips\"><span class=\"mono sub\">{{ ref }}<\u002Fspan><span class=\"chip ok\">Completed<\u002Fspan><span class=\"chip plain mute\">{{ methodLabel }}<\u002Fspan><\u002Fdiv>\n      <h1 class=\"h1\">{{ title }}<\u002Fh1>\n      <div class=\"meta\"><span>Agent <strong>{{ agent }}<\u002Fstrong><\u002Fspan><span>Completed {{ completed }}<\u002Fspan><span>{{ projectName }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chips\"><span class=\"sub\">Human review<\u002Fspan><span class=\"chip \">{{ rsLabel }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"tabs\">\n    \n      <button class=\"tab \">{{ t.label }}<span class=\"n\">{{ t.count }}<\u002Fspan><\u002Fbutton>\n    \n  <\u002Fdiv>\n\n  <div class=\"cols\">\n  <div class=\"main\">\n\n  \n  <div class=\"stack\">\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">{{ origLabel }}<\u002Fh2><span class=\"chip plain mute\">{{ origSource }}<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b\">\n        <p class=\"body\">{{ origText }}<\u002Fp>\n        <div class=\"kvs\"><div><div class=\"lbl\">{{ kv.k }}<\u002Fdiv><div>{{ kv.v }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-h\">\n        <div class=\"agentrow\"><span class=\"avatar ag\">{{ agentInitial }}<\u002Fspan><div><div class=\"strong\">{{ agent }}<\u002Fdiv><div class=\"sub\">{{ agentRole }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <span class=\"chip plain mute\">Agent-reported summary<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card-b\">\n        <p class=\"body\">{{ summary }}<\u002Fp>\n        <div class=\"note\">This is the agent's own account of its work. Use Evidence and Requirements to check it independently.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    \n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Pull request<\u002Fh2><div class=\"chips\"><span class=\"chip info\">Open<\u002Fspan><span class=\"chip mute\">Not merged<\u002Fspan><span class=\"chip warn\">Checks passed (1 re-run)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"card-b\">\n        <div class=\"strong\">{{ prTitle }}<\u002Fdiv>\n        <div class=\"mono sub\" style=\"margin-top:4px\">{{ prBranch }}<\u002Fdiv>\n        <div class=\"tiles\"><div class=\"tile\"><div class=\"tnum \">{{ ti.n }}<\u002Fdiv><div class=\"sub\">{{ ti.l }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"row\"><button class=\"btn sm\" disabled=\"\">Open on GitHub<\u002Fbutton><span class=\"sub\">{{ prRepo }} · link disabled in this illustration<\u002Fspan><\u002Fdiv>\n        <div class=\"lbl mt\">Agent's explanation of the implementation<\u002Fdiv>\n        <ul class=\"list\"><li>{{ ex }}<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n\n    \n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Execution<\u002Fh2><span class=\"chip plain info\">Direct Ziki execution<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b\">\n        <p class=\"body\">{{ dxNote }}<\u002Fp>\n        <div class=\"tiles\"><div class=\"tile\"><div class=\"tnum\">{{ tj.n }}<\u002Fdiv><div class=\"sub\">{{ tj.l }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Requirements<\u002Fh2><button class=\"linkbtn\">Review requirements<\u002Fbutton><\u002Fdiv>\n      <div class=\"card-b nopad\">\n        <div class=\"lrow\"><span class=\"rnum\">{{ rq.num }}<\u002Fspan><span class=\"grow\">{{ rq.text }}<\u002Fspan><span class=\"chip \">{{ rq.stateLabel }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    \n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Work performed<\u002Fh2><span class=\"sub\">3 commits<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b nopad\">\n        <div class=\"lrow\"><span class=\"mono sha\">{{ cm.sha }}<\u002Fspan><span class=\"grow\">{{ cm.msg }}<\u002Fspan><span class=\"sub\">{{ cm.t }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n\n    \n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Work performed<\u002Fh2><button class=\"linkbtn\">Inspect actions<\u002Fbutton><\u002Fdiv>\n      <div class=\"card-b nopad\">\n        <div class=\"lrow\"><span class=\"rnum\">{{ ac.n }}<\u002Fspan><span class=\"grow\">{{ ac.title }}<\u002Fspan><span class=\"chip \">{{ ac.outcome }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n\n    <div class=\"card\">\n      <div class=\"card-h\"><h2 class=\"h3\">Testing and evidence<\u002Fh2><button class=\"linkbtn\">Open evidence<\u002Fbutton><\u002Fdiv>\n      <div class=\"card-b\"><div class=\"glance\">\n        <div class=\"gcard\"><span class=\"chip plain \">{{ g.tag }}<\u002Fspan><div class=\"gbig\">{{ g.big }}<\u002Fdiv><div class=\"sub\">{{ g.sub }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n\n  \n  <div class=\"stack\">\n    <p class=\"sub\" style=\"margin:0\">Each action the agent took, in order. Expand an action to see what was recorded. Anything not recorded is marked as such.<\u002Fp>\n    \n    <div class=\"card\">\n      <button class=\"evh\">\n        <span class=\"rnum\">{{ ax.n }}<\u002Fspan>\n        <span class=\"grow\"><span class=\"strong\">{{ ax.title }}<\u002Fspan><br><span class=\"sub\">{{ ax.kind }}<\u002Fspan><\u002Fspan>\n        <span class=\"chip \">{{ ax.outcome }}<\u002Fspan>\n        <span class=\"sub\">{{ ax.chev }}<\u002Fspan>\n      <\u002Fbutton>\n      \n      <div class=\"evb\">\n        <p class=\"body\">{{ ax.detail }}<\u002Fp>\n        <pre class=\"log\">{{ ax.log }}<\u002Fpre>\n        <div class=\"note\">This action is outside the original instruction. Decide whether it should stay.<\u002Fdiv>\n        <div class=\"row mt\">\n          <button class=\"btn sm\">View the change<\u002Fbutton>\n          <button class=\"btn sm\">Flag this action<\u002Fbutton>\n          <span class=\"chip warn\">{{ ax.disputeCount }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      \n    <\u002Fdiv>\n    \n  <\u002Fdiv>\n  \n\n  \n  <div class=\"split\">\n    <div class=\"card filelist\">\n      <div class=\"card-h\"><h2 class=\"h3\">{{ changesTitle }}<\u002Fh2><span class=\"sub\">{{ changesSub }}<\u002Fspan><\u002Fdiv>\n      \n        <button class=\"fileitem \">\n          <span class=\"fname\">{{ ch.name }}<\u002Fspan>\n          <span class=\"fdir\">{{ ch.dir }}<\u002Fspan>\n          <span class=\"row\" style=\"gap:8px\"><span class=\"chip plain \">{{ ch.kindLabel }}<\u002Fspan><span class=\"chip \">{{ ch.revLabel }}<\u002Fspan><\u002Fspan>\n          <span class=\"mono\"><span class=\"add\">+{{ ch.adds }}<\u002Fspan> <span class=\"del\">−{{ ch.dels }}<\u002Fspan><\u002Fspan>\n        <\u002Fbutton>\n      \n    <\u002Fdiv>\n    <div class=\"filedetail\">\n      <div class=\"card\">\n        <div class=\"card-h\">\n          <div><div class=\"strong mono\">{{ selPath }}<\u002Fdiv><div class=\"sub\">{{ selKindText }}<\u002Fdiv><\u002Fdiv>\n          <div class=\"row\">\n            <button class=\"btn sm\">{{ reviewBtn }}<\u002Fbutton>\n            <button class=\"btn sm pri\">Raise dispute<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-b\">\n          \n            <div class=\"linebar\"><span>Selected: {{ selLineLabel }}. A dispute raised now will point to this line.<\u002Fspan><button class=\"linkbtn\">Clear<\u002Fbutton><\u002Fdiv>\n          \n          \n            <div class=\"sub\" style=\"margin:0 0 10px\">{{ diffHelp }}<\u002Fdiv>\n            <div class=\"diff\">\n              \n                <div>\n                  <button class=\"ln o \">{{ r.oNo }}<\u002Fbutton>\n                  <div>{{ r.oTxt }}<\u002Fdiv>\n                  <button class=\"ln n \">{{ r.nNo }}<\u002Fbutton>\n                  <div>{{ r.nTxt }}<\u002Fdiv>\n                <\u002Fdiv>\n              \n            <\u002Fdiv>\n          \n          \n            <div class=\"nc-box\"><div class=\"strong\">Before and after not captured<\u002Fdiv><p class=\"body\" style=\"margin-top:6px\">The execution recorded that this component was modified, but it did not record what changed. Ziki cannot show a comparison for it. Check the project's own history, or flag the action.<\u002Fp><\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"card-h\"><h2 class=\"h3\">Disputes on this item<\u002Fh2><span class=\"sub\">{{ itemDisputeCount }}<\u002Fspan><\u002Fdiv>\n        <div class=\"card-b nopad\">\n          <div class=\"lrow sub\">No disputes raised on this item.<\u002Fdiv>\n          \n            <div class=\"lrow\"><span class=\"mono\">{{ idp.id }}<\u002Fspan><span class=\"chip \">{{ idp.sevLabel }}<\u002Fspan><span class=\"grow\">{{ idp.text }}<\u002Fspan><span class=\"chip \">{{ idp.stLabel }}<\u002Fspan><button class=\"linkbtn\">Open<\u002Fbutton><\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n\n  \n  <div class=\"stack\">\n    <p class=\"sub\" style=\"margin:0\">Evidence is grouped by who produced it. Nothing here is treated as proof on its own. Decide for yourself.<\u002Fp>\n    \n    <div class=\"card\">\n      <div class=\"card-h\"><div><div class=\"chips\"><span class=\"chip plain \">{{ sec.tag }}<\u002Fspan><\u002Fdiv><h2 class=\"h3\" style=\"margin-top:6px\">{{ sec.title }}<\u002Fh2><div class=\"sub\">{{ sec.desc }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"card-b nopad\">\n        \n        <div class=\"ev\">\n          <button class=\"evh\">\n            <span class=\"grow\"><span class=\"strong\">{{ er.title }}<\u002Fspan><br><span class=\"sub\">{{ er.meta }}<\u002Fspan><\u002Fspan>\n            <span class=\"chip \">{{ er.label }}<\u002Fspan>\n            <span class=\"sub\">{{ er.chev }}<\u002Fspan>\n          <\u002Fbutton>\n          \n          <div class=\"evb\">\n            <p class=\"body\">{{ er.note }}<\u002Fp>\n            <pre class=\"log\">{{ er.log }}<\u002Fpre>\n          <\u002Fdiv>\n          \n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n    <div class=\"card\">\n      <div class=\"card-h\"><div><div class=\"chips\"><span class=\"chip plain ok\">Your verification<\u002Fspan><\u002Fdiv><h2 class=\"h3\" style=\"margin-top:6px\">Verify it yourself<\u002Fh2><div class=\"sub\">Steps you can run independently. Tick them as you go.<\u002Fdiv><\u002Fdiv><span class=\"sub\">{{ stepsDone }}<\u002Fspan><\u002Fdiv>\n      <div class=\"card-b nopad\">\n        \n          <label class=\"step\"><input type=\"checkbox\"><span class=\"grow\"><span>{{ st.text }}<\u002Fspan><code class=\"cmd\">{{ st.cmd }}<\u002Fcode><\u002Fspan><\u002Flabel>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n\n  \n  <div class=\"card\">\n    <div class=\"card-h\"><h2 class=\"h3\">Requirements<\u002Fh2><span class=\"sub\">Compare the work against what was asked. The agent's claim is shown for reference only.<\u002Fspan><\u002Fdiv>\n    \n    <div class=\"req\">\n      <div class=\"row\" style=\"align-items:flex-start\"><span class=\"rnum\">{{ q.num }}<\u002Fspan><div class=\"grow\"><div class=\"strong\">{{ q.text }}<\u002Fdiv>\n        <div class=\"row\" style=\"margin-top:8px\"><span class=\"chip plain mute\">Agent reports: met<\u002Fspan><span class=\"chip \">{{ q.ev }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><span class=\"chip \">{{ q.stateLabel }}<\u002Fspan><\u002Fdiv>\n      <div class=\"row mt\" style=\"margin-left:36px\">\n        <div class=\"segs\">\n          <button class=\"seg \">Verified<\u002Fbutton>\n          <button class=\"seg \">Not satisfied<\u002Fbutton>\n          <button class=\"seg \">Needs investigation<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"btn sm\">Raise dispute<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n  <\u002Fdiv>\n  \n\n  \n  <div class=\"stack\">\n    <div class=\"row between\">\n      <div class=\"segs\"><button class=\"seg \">Outstanding ({{ nActive }})<\u002Fbutton><button class=\"seg \">All ({{ nAll }})<\u002Fbutton><\u002Fdiv>\n      <span class=\"sub\">Raise disputes from a file, an action or a requirement.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"nc-box\">No disputes to show. Raise one from a changed file, an action or a req
