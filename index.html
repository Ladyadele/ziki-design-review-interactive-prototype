rm it opens the invite page and not a 404.', cmd: '' },\n          { id: 'w2', text: 'Search the project for remaining uses of the old step name.', cmd: 'grep -r \"Connect repo\" .' },\n          { id: 'w3', text: 'Review the Welcome email template. The execution did not record what changed.', cmd: '' }\n        ]\n      }\n    };\n    return this._d;\n  }\n\n  statusFor(path) {\n    const s = this.state, P = this.data()[path];\n    const revN = P.changes.filter((x) => s.reviewed[x.id]).length;\n    const decided = P.reqs.filter((x) => s.req[x.id]).length;\n    const outs = s.disputes.filter((x) => x.path === path && x.status !== 'resolved').length;\n    const dec = s.decision[path];\n    if (dec === 'approved') return ['Approved', 'ok'];\n    if (dec === 'changes') return ['Changes requested', 'warn'];\n    if (revN + decided > 0 || outs > 0) return ['In review', 'info'];\n    return ['Not started', 'mute'];\n  }\n\n  renderVals() {\n    const s = this.state, D = this.data(), set = (o) => this.setState(o);\n    const path = s.path, P = D[path], isPR = path === 'pr';\n    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');\n\n    const openPath = (p) => () => set({ view: 'review', path: p, tab: 'overview', form: null, flash: '' });\n    const tab = (!isPR || s.tab !== 'execution') ? s.tab : 'overview';\n\n    // Changes\n    const kindMap = { modified: ['Modified', 'info'], added: ['Added', 'ok'], deleted: ['Deleted', 'bad'], component: ['Modified component', 'info'] };\n    const changes = P.changes.map((x) => {\n      const rows = x.rows || [];\n      const rev = !!s.reviewed[x.id];\n      const km = kindMap[x.kind];\n      const slash = x.path.lastIndexOf('/');\n      return {\n        id: x.id, path: x.path, rows, unavailable: !!x.unavailable, kind: x.kind,\n        name: slash >= 0 ? x.path.slice(slash + 1) : x.path,\n        dir: slash >= 0 ? x.path.slice(0, slash + 1) : '',\n        kindLabel: km[0], kindTone: km[1],\n        adds: rows.filter((r) => r[5] === 'a').length, dels: rows.filter((r) => r[2] === 'd').length,\n        hasStats: !x.unavailable, rev,\n        revLabel: rev ? 'Reviewed' : 'To review', revTone: rev ? 'ok' : 'mute',\n        cls: s.sel[path] === x.id ? 'on' : '',\n        pick: () => set({ sel: { ...s.sel, [path]: x.id } })\n      };\n    });\n    const selected = changes.find((x) => x.id === s.sel[path]) || changes[0];\n    const sl = s.line[selected.id] || null;\n    const mode = selected.kind === 'added' ? 'new' : selected.kind === 'deleted' ? 'old' : 'both';\n    const pre = { c: '  ', d: '− ', a: '+ ', e: '' };\n    const pickLine = (key, label) => () => set({ line: { ...s.line, [selected.id]: (sl && sl.key === key) ? null : { key, label } } });\n    const diff = selected.unavailable ? [] : selected.rows.map((r) => {\n      const oKey = 'o' + r[0], nKey = 'n' + r[3], sk = sl ? sl.key : '';\n      return {\n        rowCls: 'drow ' + mode + ((sk && (sk === oKey || sk === nKey)) ? ' sel' : ''),\n        oNo: r[0] == null ? '' : String(r[0]), noO: r[0] == null,\n        oLn: r[2] === 'd' ? 'del' : '', oAria: r[0] == null ? '' : 'Select original line ' + r[0],\n        oTxt: r[2] === 'e' ? '' : pre[r[2]] + r[1],\n        oCls: 'cell o ' + (r[2] === 'd' ? 'del' : r[2] === 'c' ? 'ctx' : 'empty'),\n        pickO: pickLine(oKey, 'Original line ' + r[0]),\n        nNo: r[3] == null ? '' : String(r[3]), noN: r[3] == null,\n        nLn: r[5] === 'a' ? 'add' : '', nAria: r[3] == null ? '' : 'Select updated line ' + r[3],\n        nTxt: r[5] === 'e' ? '' : pre[r[5]] + r[4],\n        nCls: 'cell n ' + (r[5] === 'a' ? 'add' : r[5] === 'c' ? 'ctx' : 'empty'),\n        pickN: pickLine(nKey, 'Updated line ' + r[3])\n      };\n    });\n\n    // Disputes\n    const sevMap = { blocking: ['Blocking', 'bad'], should: ['Should fix', 'warn'], question: ['Question', 'info'] };\n    const stMap = { open: ['Open · awaiting agent', 'warn'], addressed: ['Agent replied · your call', 'info'], resolved: ['Resolved', 'ok'] };\n    const allD = s.disputes.filter((x) => x.path === path);\n    const outstanding = allD.filter((x) => x.status !== 'resolved');\n    const addEvent = (id, status, ev) => set({ disputes: s.disputes.map((x) => x.id !== id ? x : { ...x, status, events: [...x.events, ev] }) });\n    const goTarget = (x) => () => {\n      if (x.tType === 'change') set({ tab: 'changes', sel: { ...s.sel, [x.path]: x.tId } });\n      else if (x.tType === 'action') set({ tab: 'execution', open: { ...s.open, [x.tId]: true } });\n      else set({ tab: 'requirements' });\n    };\n    const dVm = (x) => ({\n      id: x.id, tLabel: x.tLabel, lineText: x.line ? ' · ' + x.line : '', text: x.text, fix: x.fix, hasFix: !!x.fix,\n      sevLabel: sevMap[x.sev][0], sevTone: sevMap[x.sev][1], stLabel: stMap[x.status][0], stTone: stMap[x.status][1],\n      events: x.events.map((e) => ({ who: e.who, time: e.time, text: e.text })),\n      goTarget: goTarget(x),\n      canReply: x.status === 'open', canResolve: x.status !== 'resolved', canReopen: x.status === 'resolved',\n      reply: () => addEvent(x.id, 'addressed', { who: P.agent + ' (agent)', agent: true, time: 'Just now', text: x.sev === 'question' ? 'Here is my reasoning. No change made. (Simulated reply for this demo.)' : 'Acknowledged. I will revise this as requested and post the updated change here for you to check. (Simulated reply for this demo.)' }),\n      resolve: () => addEvent(x.id, 'resolved', { who: 'You', agent: false, time: 'Just now', text: 'Marked resolved.' }),\n      reopen: () => addEvent(x.id, 'open', { who: 'You', agent: false, time: 'Just now', text: 'Reopened.' }),\n      openAll: () => set({ tab: 'disputes', dFilter: 'all' })\n    });\n    const shown = (s.dFilter === 'all' ? allD : outstanding).map(dVm);\n    const itemD = allD.filter((x) => x.tType === 'change' && x.tId === selected.id).map(dVm);\n\n    const openForm = (tType, tId, tLabel, line) => {\n      this._draft = { text: '', fix: '', sev: 'should' };\n      set({ form: { tType, tId, tLabel, line: line || '' }, formErr: false, flash: '' });\n    };\n    const submit = () => {\n      const dr = this._draft || {};\n      if (!dr.text || !dr.text.trim()) { set({ formErr: true }); return; }\n      const f = s.form, id = 'D-' + s.seq;\n      set({\n        disputes: [...s.disputes, { id, path, tType: f.tType, tId: f.tId, tLabel: f.tLabel, line: f.line, sev: dr.sev || 'should', status: 'open', text: dr.text.trim(), fix: (dr.fix || '').trim(), events: [{ who: 'You', agent: false, time: 'Just now', text: 'Dispute raised. Sent to ' + P.agent + '.' }] }],\n        form: null, formErr: false, seq: s.seq + 1, flash: id + ' raised and sent to ' + P.agent + '. Track it in Disputes.'\n      });\n    };\n    const form = s.form ? {\n      tLabel: s.form.tLabel, line: s.form.line, hasLine: !!s.form.line, err: s.formErr,\n      setText: (e) => { this._draft.text = e.target.value; },\n      setFix: (e) => { this._draft.fix = e.target.value; },\n      setSev: (e) => { this._draft.sev = e.target.value; },\n      cancel: () => set({ form: null, formErr: false }), submit\n    } : { tLabel: '', line: '', hasLine: false, err: false, setText: () => {}, setFix: () => {}, setSev: () => {}, cancel: () => {}, submit: () => {} };\n\n    // Requirements\n    const stLabels = { v: ['Verified', 'ok'], n: ['Not satisfied', 'bad'], i: ['Needs investigation', 'warn'] };\n    const reqs = P.reqs.map((r, i) => {\n      const st = s.req[r.id] || null, lab = st ? stLabels[st] : ['Unreviewed', 'mute'];\n      const put = (v) => () => set({ req: { ...s.req, [r.id]: st === v ? null : v } });\n      return {\n        id: r.id, num: i + 1, text: r.text, ev: r.ev, evTone: r.evTone, stateLabel: lab[0], stateTone: lab[1],\n        vCls: st === 'v' ? 'on-ok' : '', nCls: st === 'n' ? 'on-bad' : '', iCls: st === 'i' ? 'on-warn' : '',\n        setV: put('v'), setN: put('n'), setI: put('i'),\n        raise: () => openForm('req', r.id, 'Requirement ' + (i + 1) + ': ' + r.text, '')\n      };\n    });\n    const nV = reqs.filter((r) => s.req[r.id] === 'v').length, nN = reqs.filter((r) => s.req[r.id] === 'n').length, nI = reqs.filter((r) => s.req[r.id] === 'i').length;\n    const nU = reqs.length - nV - nN - nI;\n\n    // Actions (direct)\n    const actions = (P.actions || []).map((x, i) => {\n      const isOpen = !!s.open[x.id];\n      const cnt = allD.filter((dx) => dx.tType === 'action' && dx.tId === x.id).length;\n      return {\n        n: i + 1, title: x.title, kind: x.kind, detail: x.detail, log: x.log, hasLog: !!x.log, outcome: x.outcome, tone: x.tone,\n        scope: x.scope, open: isOpen, chev: isOpen ? 'Hide' : 'Details',\n        toggle: () => set({ open: { ...s.open, [x.id]: !isOpen } }),\n        hasChange: !!x.change,\n        goChange: () => set({ tab: 'changes', sel: { ...s.sel, dx: x.change } }),\n        flag: () => openForm('action', x.id, 'Action ' + (i + 1) + ': ' + x.title, ''),\n        hasDisputes: cnt > 0, disputeCount: plural(cnt, 'dispute')\n      };\n    });\n\n    // Evidence\n    const sections = P.evidence.map((sec) => ({\n      tag: sec.tag, tagTone: sec.tagTone, title: sec.title, desc: sec.desc,\n      rows: sec.rows.map((r) => {\n        const o = !!s.open[r.id];\n        return { title: r.title, meta: r.meta, label: r.label, tone: r.tone, note: r.note, log: r.log, hasLog: !!r.log, open: o, chev: o ? 'Hide' : 'Details', toggle: () => set({ open: { ...s.open, [r.id]: !o } }) };\n      })\n    }));\n    const allEv = P.evidence.reduce((acc, sec) => acc.concat(sec.rows), []);\n    const evOk = allEv.filter((r) => r.tone === 'ok').length, evNc = allEv.filter((r) => r.tone === 'mute').length, evAttn = allEv.filter((r) => r.tone === 'warn' || r.tone === 'bad').length;\n    const steps = P.steps.map((st) => ({ text: st.text, cmd: st.cmd, hasCmd: !!st.cmd, done: !!s.steps[st.id], toggle: () => set({ steps: { ...s.steps, [st.id]: !s.steps[st.id] } }) }));\n    const stepsDoneN = steps.filter((x) => x.done).length;\n    const glance = P.evidence.map((sec) => {\n      const ok = sec.rows.filter((r) => r.tone === 'ok').length, nc = sec.rows.filter((r) => r.tone === 'mute').length, at = sec.rows.length - ok - nc;\n      return { tag: sec.tag, tagTone: sec.tagTone, big: ok + ' of ' + sec.rows.length, sub: (sec.tag === 'Agent reported' ? 'claims corroborated' : 'passing or captured') + (at ? ' · ' + at + ' need attention' : '') + (nc ? ' · ' + nc + ' not captured' : '') };\n    });\n    glance.push({ tag: 'Your verification', tagTone: 'ok', big: stepsDoneN + ' of ' + steps.length, sub: 'independent steps done' });\n\n    // Progress and decision\n    const revN = changes.filter((x) => x.rev).length;\n    const decidedReqs = reqs.length - nU;\n    const total = changes.length + reqs.length;\n    const pct = Math.round(((revN + decidedReqs) / total) * 100);\n    const dec = s.decision[path];\n    const [rsLabel, rsTone] = this.statusFor(path);\n    const approveDisabled = outstanding.length > 0 || nN > 0;\n    const requestDisabled = outstanding.length === 0 && nN === 0 && nI === 0;\n    const notes = [];\n    if (nN > 0) notes.push({ tone: 'bad', tag: 'Unmet', text: plural(nN, 'requirement') + ' marked not satisfied.' });\n    if (outstanding.length > 0) notes.push({ tone: 'bad', tag: 'Disputes', text: plural(outstanding.length, 'dispute') + ' still outstanding.' });\n    if (nI > 0) notes.push({ tone: 'warn', tag: 'Investigate', text: plural(nI, 'requirement') + ' marked as needing investigation.' });\n    if (nU > 0) notes.push({ tone: 'warn', tag: 'Unreviewed', text: plural(nU, 'requirement') + ' not reviewed yet.' });\n    if (changes.length - revN > 0) notes.push({ tone: 'warn', tag: 'Unreviewed', text: plural(changes.length - revN, isPR ? 'file' : 'change') + ' not reviewed yet.' });\n    if (evNc > 0) notes.push({ tone: 'mute', tag: 'Not captured', text: plural(evNc, 'evidence item') + ' not captured by the execution. They cannot support approval.' });\n    if (isPR) notes.push({ tone: 'warn', tag: 'Checks', text: 'e2e-smoke passed only on re-run after a first-attempt timeout.' });\n    if (notes.length === 0) notes.push({ tone: 'ok', tag: 'Clear', text: 'Nothing outstanding.' });\n    const stats = [\n      { k: 'Work reviewed', v: revN + '/' + changes.length, sub: isPR ? 'files reviewed' : 'changes reviewed', tone: revN === changes.length ? 'ok' : '' },\n      { k: 'Requirements verified', v: nV + '/' + reqs.length, sub: 'by you', tone: nV === reqs.length ? 'ok' : '' },\n      { k: 'Not satisfied', v: String(nN), sub: 'requirements', tone: nN > 0 ? 'bad' : '' },\n      { k: 'Needs investigation', v: String(nI), sub: 'requirements', tone: nI > 0 ? 'warn' : '' },\n      { k: 'Outstanding disputes', v: String(outstanding.length), sub: 'open or awaiting your check', tone: outstanding.length > 0 ? 'bad' : '' },\n      { k: 'Test evidence', v: evOk + '/' + allEv.length, sub: 'passing or corroborated · ' + evNc + ' not captured · ' + evAttn + ' need attention', tone: '' }\n    ];\n    const decisionText = dec === 'approved'\n      ? 'Approved. Your decision is recorded in Ziki.' + (isPR ? ' The pull request has not been merged.' : ' No other action was triggered.')\n      : dec === 'changes' ? 'Changes requested. ' + plural(outstanding.length, 'dispute') + ' and ' + plural(nN + nI, 'requirement') + ' flagged were sent to ' + P.agent + '.' : '';\n\n    const tabDefs = isPR\n      ? [['overview', 'Overview'], ['changes', 'Files changed'], ['evidence', 'Evidence'], ['requirements', 'Requirements'], ['disputes', 'Disputes'], ['decision', 'Decision']]\n      : [['overview', 'Overview'], ['execution', 'Actions'], ['changes', 'Changes made'], ['evidence', 'Evidence'], ['requirements', 'Requirements'], ['disputes', 'Disputes'], ['decision', 'Decision']];\n    const counts = { changes: String(changes.length), execution: String(P.actions ? P.actions.length : 0), requirements: nV + '/' + reqs.length, disputes: outstanding.length > 0 ? String(outstanding.length) : '' };\n    const tabs = tabDefs.map(([id, label]) => ({ label, cls: tab === id ? 'on' : '', count: counts[id] || '', hasCount: !!counts[id], go: () => set({ tab: id, flash: '' }) }));\n\n    const tilesPR = [\n      { n: String(changes.length), l: 'Files changed', cls: '' },\n      { n: '+' + changes.reduce((x, y) => x + y.adds, 0), l: 'Lines added', cls: 'add' },\n      { n: '−' + changes.reduce((x, y) => x + y.dels, 0), l: 'Lines removed', cls: 'del' }\n    ];\n    const tilesDX = [\n      { n: String(actions.length), l: 'Actions recorded', cls: '' },\n      { n: String(changes.length), l: 'Changes recorded', cls: '' },\n      { n: String(evNc), l: 'Evidence not captured', cls: '' }\n    ];\n\n    const lastRow = changes.length;\n    return {\n      accent: this.props.accent ?? '#4F46E5',\n      isList: s.view === 'list', isReview: s.view === 'review', isPR, isDX: !isPR,\n      projectName: P.project, crumbLast: s.view === 'list' ? 'Awaiting review' : P.ref,\n      demoPrCls: (s.view === 'review' && isPR) ? 'on' : '', demoDxCls: (s.view === 'review' && !isPR) ? 'on' : '',\n      openPR: openPath('pr'), openDX: openPath('dx'),\n      backToList: () => set({ view: 'list', form: null, flash: '' }),\n      listItems: ['pr', 'dx'].map((p) => { const st = this.statusFor(p); return { ref: D[p].ref, title: D[p].title, agent: D[p].agent, completed: D[p].completed, method: D[p].method, statusLabel: st[0], statusTone: st[1], open: openPath(p) }; }),\n      ref: P.ref, title: P.title, agent: P.agent, agentRole: P.agentRole, agentInitial: P.agent.slice(0, 1), completed: P.completed, methodLabel: P.method,\n      rsLabel, rsTone,\n      tabs,\n      tOverview: tab === 'overview', tExecution: tab === 'execution', tChanges: tab === 'changes', tEvidence: tab === 'evidence', tRequirements: tab === 'requirements', tDisputes: tab === 'disputes', tDecision: tab === 'decision',\n      origLabel: P.origLabel, origSource: P.origSource, origText: P.origText, kvs: P.kvs, summ
